[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Crack/Phase features"
version = "1.0"
description = "Tool for quantification of cracks in material surface."
dependencies = [
    "numpy",
    "pandas",
    "opencv-python-headless",
    "scikit-image",
    "scipy",
    "tqdm",
    "matplotlib",
    "shapely",
    "pyyaml",
    "imagecodecs"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

threshold_levels:
  # output image will be colored according to the ranges below
  # ranges should cover <0, 255>
  # the upper boundary is not included in the range
  - {range: [0, 15], color: [0, 0, 0]}
  - {range: [25, 40], color: [255, 50, 50]}
  - {range: [40, 140], color: [200, 200, 200]}
  - {range: [140, 230], color: [0, 255, 50]}
  - {range: [230, 256], color: [255, 255, 255]}
median_level: 95
